<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a050d"/>
      <stop offset="60%" stop-color="#1b0a1a"/>
      <stop offset="100%" stop-color="#380e22"/>
    </linearGradient>
    <linearGradient id="busBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="40%" stop-color="#d50000"/>
      <stop offset="80%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#2d050d"/>
    </linearGradient>
    <linearGradient id="flameGraphic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="30%" stop-color="#ff6d00"/>
      <stop offset="70%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#790e24"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="40%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#415a77"/>
    </linearGradient>
    <linearGradient id="neonLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="headlightBeam" x="0%" y="0%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <!-- Background Stage -->
  <rect width="1000" height="600" fill="url(#skyGrad)"/>
  
  <!-- Ground Grid & Reflection -->
  <ellipse cx="500" cy="510" rx="460" ry="40" fill="#000000" opacity="0.6"/>
  <path d="M 0 520 L 1000 520" stroke="#ff1744" stroke-width="2" opacity="0.3"/>
  <path d="M 100 520 L 900 520" stroke="#ff3d68" stroke-width="4" opacity="0.4" filter="url(#neonGlow)"/>

  <!-- Bus Silhouette / Shadow -->
  <path d="M 120 480 Q 500 540 880 480 Q 500 520 120 480 Z" fill="#000000" opacity="0.8"/>

  <!-- Main Bus Chassis -->
  <!-- Aerodynamic Front & Roof Curve -->
  <path d="M 140 430 L 135 240 Q 145 160 220 145 L 780 145 Q 860 145 875 220 L 880 430 Q 880 460 850 460 L 170 460 Q 140 460 140 430 Z" fill="url(#busBodyGrad)" stroke="#ff3d68" stroke-width="2"/>

  <!-- Front Windshield & Panoramic Side Windows -->
  <path d="M 155 230 Q 165 170 230 160 L 450 160 L 450 280 L 155 280 Z" fill="url(#glassGrad)" stroke="#1a2536" stroke-width="3" opacity="0.95"/>
  <path d="M 465 160 L 650 160 L 650 280 L 465 280 Z" fill="url(#glassGrad)" stroke="#1a2536" stroke-width="3" opacity="0.95"/>
  <path d="M 665 160 L 850 160 Q 865 180 865 240 L 865 280 L 665 280 Z" fill="url(#glassGrad)" stroke="#1a2536" stroke-width="3" opacity="0.95"/>

  <!-- Window Glow / Interior RGB Ambient Lights -->
  <rect x="160" y="165" width="280" height="8" fill="#ff0055" filter="url(#neonGlow)" opacity="0.8"/>
  <rect x="470" y="165" width="170" height="8" fill="#ff0055" filter="url(#neonGlow)" opacity="0.8"/>
  <rect x="670" y="165" width="185" height="8" fill="#ff0055" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Signature Flame Decal across Side Body -->
  <path d="M 150 360 C 260 300 350 440 480 340 C 600 240 700 390 870 320 L 875 420 C 750 450 620 370 500 440 C 360 520 250 390 145 420 Z" fill="url(#flameGraphic)" opacity="0.9"/>
  <path d="M 220 370 C 320 320 400 420 520 350 C 620 280 720 380 840 330" fill="none" stroke="#fffb00" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- KMS Branding Badge on Bus Side -->
  <rect x="360" y="320" width="280" height="56" rx="12" fill="#11050a" stroke="#ffd700" stroke-width="2"/>
  <text x="500" y="358" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">KMS TRAVELS</text>

  <!-- Number Plate -->
  <rect x="160" y="420" width="120" height="24" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="220" y="437" font-family="monospace" font-size="12" font-weight="900" fill="#111111" text-anchor="middle">TN 23 BS 8742</text>

  <!-- Wheels & Chrome Alloys -->
  <!-- Front Wheel -->
  <circle cx="260" cy="460" r="55" fill="#151515" stroke="#333" stroke-width="6"/>
  <circle cx="260" cy="460" r="36" fill="#2a2a2a" stroke="#d50000" stroke-width="4"/>
  <circle cx="260" cy="460" r="16" fill="#e0e0e0" stroke="#ffd700" stroke-width="3"/>
  <line x1="260" y1="426" x2="260" y2="494" stroke="#ff3d68" stroke-width="3"/>
  <line x1="226" y1="460" x2="294" y2="460" stroke="#ff3d68" stroke-width="3"/>

  <!-- Rear Wheel 1 -->
  <circle cx="710" cy="460" r="55" fill="#151515" stroke="#333" stroke-width="6"/>
  <circle cx="710" cy="460" r="36" fill="#2a2a2a" stroke="#d50000" stroke-width="4"/>
  <circle cx="710" cy="460" r="16" fill="#e0e0e0" stroke="#ffd700" stroke-width="3"/>
  <line x1="710" y1="426" x2="710" y2="494" stroke="#ff3d68" stroke-width="3"/>
  <line x1="676" y1="460" x2="744" y2="460" stroke="#ff3d68" stroke-width="3"/>

  <!-- Rear Wheel 2 (Multi-Axle Luxury Coach) -->
  <circle cx="815" cy="460" r="55" fill="#151515" stroke="#333" stroke-width="6"/>
  <circle cx="815" cy="460" r="36" fill="#2a2a2a" stroke="#d50000" stroke-width="4"/>
  <circle cx="815" cy="460" r="16" fill="#e0e0e0" stroke="#ffd700" stroke-width="3"/>
  <line x1="815" y1="426" x2="815" y2="494" stroke="#ff3d68" stroke-width="3"/>
  <line x1="781" y1="460" x2="849" y2="460" stroke="#ff3d68" stroke-width="3"/>

  <!-- Headlights Projector Glow -->
  <polygon points="140,360 0,330 0,420 140,390" fill="#00e5ff" opacity="0.25" filter="url(#headlightBeam)"/>
  <polygon points="140,370 0,350 0,400 140,380" fill="#ffffff" opacity="0.4" filter="url(#neonGlow)"/>
  <ellipse cx="145" cy="375" rx="8" ry="12" fill="#00e5ff" filter="url(#neonGlow)"/>

  <!-- Roof AC Pod -->
  <rect x="380" y="125" width="240" height="22" rx="10" fill="#21050b" stroke="#ff1744" stroke-width="2"/>
  <text x="500" y="141" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#ff6d00" text-anchor="middle" letter-spacing="3">CLIMATE CONTROL AC</text>

  <!-- Underglow Neon LED Strip -->
  <path d="M 180 475 L 860 475" stroke="url(#neonLight)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
</svg>
