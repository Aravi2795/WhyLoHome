<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#210005"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 250 30 C 370 30 430 80 430 180 C 430 330 250 450 250 470 C 250 450 70 330 70 180 C 70 80 130 30 250 30 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  
  <path d="M 250 50 C 350 50 405 92 405 180 C 405 310 250 425 250 440 C 250 425 95 310 95 180 C 95 92 150 50 250 50 Z" 
        fill="#0d0407" stroke="#ff3d68" stroke-width="2" opacity="0.9"/>

  <!-- Wings / Flames Ornamentation -->
  <path d="M 120 170 C 150 140 200 130 250 150 C 300 130 350 140 380 170 C 350 200 310 210 250 190 C 190 210 150 200 120 170 Z" fill="url(#flameGrad)" opacity="0.85"/>

  <!-- Crown / Star -->
  <polygon points="250,75 260,105 290,105 265,123 275,153 250,135 225,153 235,123 210,105 240,105" fill="url(#goldGrad)"/>

  <!-- Monogram KMS -->
  <text x="250" y="275" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" 
        fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">KMS</text>
  
  <!-- Subtitle TRAVELS -->
  <text x="250" y="325" font-family="'Montserrat', 'Arial', sans-serif" font-size="28" font-weight="800" 
        fill="#ffffff" text-anchor="middle" letter-spacing="12">TRAVELS</text>

  <!-- Tagline / Reg -->
  <rect x="150" y="355" width="200" height="26" rx="13" fill="#ff1744" opacity="0.8"/>
  <text x="250" y="373" font-family="'Montserrat', 'Arial', sans-serif" font-size="13" font-weight="700" 
        fill="#ffffff" text-anchor="middle" letter-spacing="2">TN 23 BS 8742</text>

  <!-- Bottom Stars -->
  <text x="250" y="415" font-family="Arial" font-size="16" fill="#ffd700" text-anchor="middle" letter-spacing="4">★ ★ ★ ★ ★</text>
</svg>
