<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGoldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="30%" stop-color="#F3C64F"/>
      <stop offset="60%" stop-color="#EAA626"/>
      <stop offset="100%" stop-color="#9C640C"/>
    </linearGradient>
    <linearGradient id="iconGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9DA84"/>
      <stop offset="100%" stop-color="#C2841A"/>
    </linearGradient>
    <linearGradient id="iconShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18231E"/>
      <stop offset="100%" stop-color="#080F0D"/>
    </linearGradient>
  </defs>

  <g transform="translate(120, 115)">
    <!-- Top Crown -->
    <g stroke="url(#iconGoldLight)" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 0,-68 C -6,-60 -12,-52 0,-40 C 12,-52 6,-60 0,-68 Z" fill="url(#iconGoldLight)"/>
      <circle cx="0" cy="-70" r="3" fill="url(#iconGoldLight)"/>
      <path d="M -12,-54 C -28,-64 -36,-44 -20,-38 C -12,-36 0,-38 0,-38 C 0,-38 12,-36 20,-38 C 36,-44 28,-64 12,-54"/>
      <circle cx="-28" cy="-62" r="2.5" fill="url(#iconGoldLight)"/>
      <circle cx="28" cy="-62" r="2.5" fill="url(#iconGoldLight)"/>
    </g>

    <!-- Side Flourishes -->
    <g stroke="url(#iconGoldSheen)" stroke-width="2" fill="none" stroke-linecap="round">
      <!-- Left -->
      <path d="M -48,-28 C -68,-40 -92,-24 -76,-4 C -68,4 -52,-4 -44,-12"/>
      <circle cx="-81" cy="-22" r="2.5" fill="url(#iconGoldLight)"/>
      <path d="M -64,-8 C -88,0 -100,28 -76,36 C -60,42 -48,20 -44,8"/>
      <path d="M -68,36 C -92,56 -84,84 -60,80 C -44,76 -40,52 -40,36"/>
      <!-- Right -->
      <path d="M 48,-28 C 68,-40 92,-24 76,-4 C 68,4 52,-4 44,-12"/>
      <circle cx="81" cy="-22" r="2.5" fill="url(#iconGoldLight)"/>
      <path d="M 64,-8 C 88,0 100,28 76,36 C 60,42 48,20 44,8"/>
      <path d="M 68,36 C 92,56 84,84 60,80 C 44,76 40,52 40,36"/>
    </g>

    <!-- Shield Frame -->
    <path d="M -45,-25 
             L 45,-25 
             C 50,-25 51,-22 51,-16
             L 51,24
             C 51,60 28,92 0,108
             C -28,92 -51,60 -51,24
             L -51,-16
             C -51,-22 -50,-25 -45,-25 Z" 
          fill="url(#iconShieldBg)" stroke="url(#iconGoldLight)" stroke-width="3.5"/>

    <!-- Inner Border -->
    <path d="M -38,-18 
             L 38,-18 
             L 43,22
             C 43,54 22,82 0,96
             C -22,82 -43,54 -43,22
             L -38,-18 Z" 
          fill="none" stroke="url(#iconGoldSheen)" stroke-width="1.4" stroke-dasharray="2.5,1.5"/>

    <!-- Monogram: SGS -->
    <g transform="translate(0, 34)" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif">
      <text x="-16" y="-6" font-size="28" font-weight="bold" fill="url(#iconGoldLight)">S</text>
      <text x="0" y="20" font-size="34" font-weight="900" fill="url(#iconGoldLight)">G</text>
      <text x="16" y="32" font-size="28" font-weight="bold" fill="url(#iconGoldLight)">S</text>
    </g>
  </g>
</svg>
